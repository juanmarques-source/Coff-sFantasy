<!DOCTYPE html>
<html lang="pt-BR">
<head>

</head>
<body>

  <main class="pagina">
    <section class="card">
      <h1 class="card__titulo">Recuperar Senha</h1>
      <p class="card__subtitulo">Digite o e-mail da sua conta e enviaremos um link de recuperação.</p>

      <form class="formulario" action="#" method="post">
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <input class="campo__input" type="email" id="email" name="email" placeholder="Digite seu e-mail..." required>
        </div>

        <button class="botao" type="submit">Enviar link de recuperação</button>
      </form>

      <p class="card__voltar">Lembrou da senha? <a class="card__link" href="index.html">Voltar para o Login</a></p>
    </section>
  </main>
