<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bem-vindo de Volta | Coff's Fantasy</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="pagina">
    <section class="card">

      <h1 class="card__titulo">Bem-vindo de Volta</h1>
      <p class="card__subtitulo">Digite seu email e senha para entrar no seu reino.</p>

      <form class="formulario" action="#" method="post">
        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <div class="campo__caixa">
            <input class="campo__input" type="email" id="email" name="email" placeholder="Digite seu email..." required>
          </div>
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <div class="campo__caixa">
            <input class="campo__input" type="password" id="senha" name="senha" placeholder="••••••••" required>
          </div>
        </div>

        <div class="opcoes">
          <div class="opcoes__lembrar">
            <input class="opcoes__checkbox" type="checkbox" id="lembrar" name="lembrar">
            <label class="opcoes__texto" for="lembrar">Lembrar de mim</label>
          </div>
          <a class="opcoes__link" href="esqueciminhasenha.html">Esqueceu a senha?</a>
        </div>

        <button class="botao" type="submit"><a href="inicio.html">Entrar</a></button>
        </form>

      <p class="card__cadastro">Ainda não tem chave? <a class="card__link" href="cadastro.html">Criar conta</a></p>
    </section>
  </main>
</body>
</html>
