<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar Nova Conta | Coff's Fantasy</title>
  <link rel="stylesheet" href="cadastro.css">
  <link rel="shortcut icon" href="Chá Mágico no País das Maravilhas.png" type="image/x-icon">
</head>
<body>


  <main class="pagina">
    <section class="card">

      <h1 class="card__titulo">Criar Nova Conta</h1>
      <p class="card__subtitulo">Inscreva-se para desbloquear todos os segredos do menu.</p>

      <form class="formulario" action="#" method="post">
        <div class="campo">
          <label class="campo__rotulo" for="nome">Nome completo</label>
          <div class="campo__caixa">
            <input class="campo__input" type="text" id="nome" name="nome" placeholder="Seu nome de aventureiro..." required>
          </div>
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="email">E-mail</label>
          <div class="campo__caixa">
            <input class="campo__input" type="email" id="email" name="email" placeholder="seunome@email.com" required>
          </div>
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="telefone">Telefone</label>
          <div class="campo__caixa">
            <input class="campo__input" type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
          </div>
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="senha">Senha</label>
          <div class="campo__caixa">
            <input class="campo__input" type="password" id="senha" name="senha" placeholder="••••••••" required>
          </div>
        </div>

        <div class="campo">
          <label class="campo__rotulo" for="confirmar-senha">Confirmar senha</label>
          <div class="campo__caixa">
            <input class="campo__input" type="password" id="confirmar-senha" name="confirmar_senha" placeholder="••••••••" required>
          </div>
        </div>

        <div class="termos">
          <input class="termos__checkbox" type="checkbox" id="termos" name="termos" checked required>
          <label class="termos__texto" for="termos">Aceito os termos do Pacto dos Mestres</label>
        </div>

        <button class="botao" type="submit"><a href="inicio.html">Iniciar minha jornada →</a></button>
      </form>

      <p class="card__login">Já possui uma chave? <a class="card__link" href="login.html">Fazer Login</a></p>
    </section>
  </main>
</body>
</html>
